    <script>
      // Auto-append trailing slash for GitHub Pages compatibility with relative asset base paths
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.includes('.github.io')) {
          const path = window.location.pathname;
          if (path && !path.endsWith('/')) {
            const segments = path.split('/');
            const lastSegment = segments[segments.length - 1];
            if (lastSegment && !lastSegment.includes('.')) {
              window.location.replace(window.location.href + '/');
            }
          }
        }
      })();

      // Clean and silence the Vite HMR WebSocket connection warnings in AI Studio preview mode
      (function() {
        if (typeof window !== 'undefined') {
          // 1. Silent Vite / WebSocket console logs
          const originalError = console.error;
          const originalWarn = console.warn;
          console.error = function(...args) {
            const logStr = args.map(arg => String(arg || '')).join(' ');
            if (logStr.includes('[vite]') || logStr.toLowerCase().includes('websocket') || logStr.includes('HMR') || logStr.includes('socket')) return;
            originalError.apply(console, args);
          };
          console.warn = function(...args) {
            const logStr = args.map(arg => String(arg || '')).join(' ');
            if (logStr.includes('[vite]') || logStr.toLowerCase().includes('websocket') || logStr.includes('HMR') || logStr.includes('socket')) return;
            originalWarn.apply(console, args);
          };

          // 2. Intercept and prevent the browser overlay uncaught error bubble-up
          window.addEventListener('error', function(e) {
            const msg = String(e.message || '');
            const filename = String(e.filename || '');
            if (
              msg.includes('vite') || 
              msg.toLowerCase().includes('websocket') || 
              msg.includes('HMR') || 
              msg.includes('closed without opened') || 
              filename.includes('vite')
            ) {
              e.preventDefault();
              e.stopPropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            const reason = e.reason ? String(e.reason.message || e.reason) : '';
            if (
              reason.includes('vite') || 
              reason.toLowerCase().includes('websocket') || 
              reason.includes('HMR') || 
              reason.includes('closed without opened') ||
              reason.includes('WebSocket')
            ) {
              e.preventDefault();
              e.stopPropagation();
              return true;
            }
          }, true);

          // 3. Implements a robust complete MockWebSocket that mimics a perfect, eternally connected WebSocket
          try {
            const OriginalWS = window.WebSocket;
            class PerfectMockWS {
              constructor(url, protocols) {
                this.url = url;
                this.protocols = protocols;
                this.readyState = 1; // Eternally OPEN
                this.bufferedAmount = 0;
                this.extensions = "";
                this.protocol = "";
                this.binaryType = "blob";
                
                // Event handlers
                this.onopen = null;
                this.onerror = null;
                this.onclose = null;
                this.onmessage = null;
                this._listeners = {};

                // Simulate safe instant connection
                setTimeout(() => {
                  const openEvent = { type: 'open', target: this, currentTarget: this };
                  if (typeof this.onopen === 'function') {
                    try { this.onopen.call(this, openEvent); } catch(e) {}
                  }
                  const callbacks = this._listeners['open'] || [];
                  for (const cb of callbacks) {
                    try { cb.call(this, openEvent); } catch(e) {}
                  }
                }, 10);
              }

              send(data) {
                // Squelch and do nothing comfortably
              }

              close(code, reason) {
                this.readyState = 3; // CLOSED
                const closeEvent = { type: 'close', code: code || 1000, reason: reason || "", wasClean: true, target: this, currentTarget: this };
                // Ensure no error triggers on close
                setTimeout(() => {
                  if (typeof this.onclose === 'function') {
                    try { this.onclose.call(this, closeEvent); } catch(e) {}
                  }
                  const callbacks = this._listeners['close'] || [];
                  for (const cb of callbacks) {
                    try { cb.call(this, closeEvent); } catch(e) {}
                  }
                }, 5);
              }

              addEventListener(type, listener, options) {
                if (!this._listeners[type]) {
                  this._listeners[type] = [];
                }
                if (!this._listeners[type].includes(listener)) {
                  this._listeners[type].push(listener);
                }
                
                if (type === 'open') this.onopen = listener;
                if (type === 'close') this.onclose = listener;
                if (type === 'error') this.onerror = listener;
                if (type === 'message') this.onmessage = listener;
              }

              removeEventListener(type, listener, options) {
                if (this._listeners[type]) {
                  this._listeners[type] = this._listeners[type].filter(l => l !== listener);
                }
              }

              dispatchEvent(event) {
                const type = event.type;
                if (this._listeners[type]) {
                  for (const cb of this._listeners[type]) {
                    try { cb.call(this, event); } catch(e) {}
                  }
                }
                return true;
              }
            }

            // Copy static constants from WebSocket prototype
            PerfectMockWS.CONNECTING = 0;
            PerfectMockWS.OPEN = 1;
            PerfectMockWS.CLOSING = 2;
            PerfectMockWS.CLOSED = 3;

            Object.defineProperty(window, 'WebSocket', {
              value: PerfectMockWS,
              configurable: true,
              writable: true
            });
          } catch (err) {
            // Safe fallback
          }
        }
