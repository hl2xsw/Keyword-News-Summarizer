<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 뉴스 리서치</title>
    <script>
      // Clean and silence the Vite HMR WebSocket connection warnings in AI Studio preview mode
      (function() {
        if (typeof window !== 'undefined') {
          // 1. Silent Vite / WebSocket console logs
          const originalError = console.error;
          const originalWarn = console.warn;
          console.error = function(...args) {
            const logStr = String(args[0] || '');
            if (logStr.includes('[vite]') || logStr.toLowerCase().includes('websocket')) return;
            originalError.apply(console, args);
          };
          console.warn = function(...args) {
            const logStr = String(args[0] || '');
            if (logStr.includes('[vite]') || logStr.toLowerCase().includes('websocket')) return;
            originalWarn.apply(console, args);
          };

          // 2. Intercept and prevent the browser overlay uncaught error bubble-up
          window.addEventListener('error', function(e) {
            const msg = String(e.message || '');
            if (msg.includes('vite') || msg.toLowerCase().includes('websocket') || msg.includes('HMR')) {
              e.preventDefault();
              e.stopPropagation();
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            const reason = String(e.reason || '');
            if (reason.includes('vite') || reason.toLowerCase().includes('websocket') || reason.includes('HMR')) {
              e.preventDefault();
              e.stopPropagation();
            }
          }, true);

          // 3. Mock WebSocket so any initialized scripts believe they connected successfully
          try {
            const OriginalWS = window.WebSocket;
            class MockWS {
              constructor(url, protocols) {
                this.url = url;
                this.readyState = 0; // CONNECTING
                this.onclose = null;
                this.onerror = null;
                this.onmessage = null;
                this.onopen = null;
                this._listeners = {};

                if (url && (url.includes('vite') || url.includes('/vite') || url.includes('3000'))) {
                  setTimeout(() => {
                    this.readyState = 1; // OPEN
                    const openEvent = { type: 'open' };
                    if (typeof this.onopen === 'function') {
                      try { this.onopen(openEvent); } catch(e) {}
                    }
                    const callbacks = this._listeners['open'] || [];
                    for (const cb of callbacks) {
                      try { cb(openEvent); } catch(e) {}
                    }
                  }, 15);
                } else if (OriginalWS) {
                  return new OriginalWS(url, protocols);
                }
              }

              addEventListener(type, listener) {
                if (!this._listeners[type]) {
                  this._listeners[type] = [];
                }
                this._listeners[type].push(listener);
                if (type === 'close') this.onclose = listener;
                if (type === 'error') this.onerror = listener;
                if (type === 'message') this.onmessage = listener;
                if (type === 'open') this.onopen = listener;
              }

              removeEventListener(type, listener) {
                if (this._listeners[type]) {
                  this._listeners[type] = this._listeners[type].filter(l => l !== listener);
                }
              }

              send(data) {}
              close() {
                this.readyState = 3; // CLOSED
              }
            }

            Object.defineProperty(window, 'WebSocket', {
              value: MockWS,
              configurable: true,
              writable: true
            });
          } catch (err) {
            // Safe fallback
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
