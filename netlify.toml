# Netlify Configuration file for News Research AI (v1.0.1)
# This file automatically registers the correct build settings and redirects on Netlify.

[build]
  # Compile only the frontend client. This avoids Node.js Express/esbuild compilation issues on Netlify's build container.
  command = "npm run build:client"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_USE_NPM_CI = "true"
  NODE_VERSION = "22.14.0"

[functions]
  node_bundler = "esbuild"

# --- Netlify Functions Redirects ---
# Redirect internal frontend api calls directly to Netlify serverless functions
[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[redirects]]
  from = "/api/brief"
  to = "/.netlify/functions/brief"
  status = 200

# --- SPA Routing Rules ---
# This rule tells Netlify to redirect all deep-links to index.html so the client-side router handles them (prevents 404 on refresh).
# MUST be defined last to prevent catching custom serverless api endpoints!
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
